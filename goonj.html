<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KRYA गूँज</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --monaco-green: #0E3B20;
            --royal-gold: #D4AF37;
        }
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 0;
        }
        .header {
            background-color: var(--monaco-green);
            color: var(--royal-gold);
            padding: 25px 20px;
            text-align: center;
            border-bottom: 4px solid var(--royal-gold);
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .header h2 { margin: 0; font-size: 24px; }
        .header p { margin: 5px 0 0 0; font-size: 14px; opacity: 0.9; }
        
        .container {
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }
        .form-box {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            border-top: 5px solid var(--royal-gold);
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--monaco-green);
            font-size: 14px;
        }
        input, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-family: inherit;
            font-size: 15px;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: var(--royal-gold);
        }
        textarea {
            resize: vertical;
            min-height: 100px;
        }
        .submit-btn {
            background-color: var(--monaco-green);
            color: var(--royal-gold);
            border: 2px solid var(--royal-gold);
            padding: 15px;
            width: 100%;
            font-size: 16px;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.3s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .submit-btn:hover {
            background-color: var(--royal-gold);
            color: var(--monaco-green);
            border-color: var(--monaco-green);
        }
        .back-btn {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: var(--monaco-green);
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>📢 KRYA गूँज</h2>
        <p>स्थानीय घोषणाएं और जनता की आवाज़ का डिजिटल लाउडस्पीकर</p>
    </div>

    <div class="container">
        <div class="form-box">
            <div class="form-group">
                <label>घोषणा या विचार का शीर्षक (Topic / Title)</label>
                <input type="text" id="announcementTitle" placeholder="मुख्य विषय या हेडलाइन लिखें">
            </div>
            <div class="form-group">
                <label>पूरा विवरण (Full Description)</label>
                <textarea id="announcementDesc" placeholder="अपनी पूरी बात या घोषणा का विवरण यहाँ विस्तार से लिखें..."></textarea>
            </div>
            <div class="form-group">
                <label>घोषणाकर्ता / संस्था का नाम (Announcer Name)</label>
                <input type="text" id="announcerName" placeholder="अपना नाम या संगठन का नाम लिखें">
            </div>
            <div class="form-group">
                <label>लक्षित क्षेत्र / स्थान (Target Location)</label>
                <input type="text" id="announcementLoc" placeholder="गाँव, ब्लॉक या ज़िले का नाम">
            </div>

            <button class="submit-btn" onclick="submitGoonj()">गूँज फैलाएं (Publish)</button>
        </div>

        <a href="dashboard.html" class="back-btn">← डैशबोर्ड पर वापस जाएँ</a>
    </div>

    <script>
        function submitGoonj() {
            const title = document.getElementById('announcementTitle').value;
            const desc = document.getElementById('announcementDesc').value;
            const name = document.getElementById('announcerName').value;
            const loc = document.getElementById('announcementLoc').value;

            if (!title || !desc || !name || !loc) {
                alert("कृपया सभी अनिवार्य जानकारी सही-सही भरें।");
                return;
            }

            alert("📢 KRYA गूँज: आपकी घोषणा स्थानीय स्तर पर प्रसारित कर दी गई है!");
            
            document.getElementById('announcementTitle').value = '';
            document.getElementById('announcementDesc').value = '';
            document.getElementById('announcerName').value = '';
            document.getElementById('announcementLoc').value = '';
        }
    </script>
</body>
  </html>
