<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KRYA GLOBAL - 100% सुरक्षित डिजिटल डैशबोर्ड</title>
    <meta name="description" content="मुकेश जी द्वारा स्थापित KRYA ग्लोबल का डिजिटल डैशबोर्ड। 100% लीगल और पारदर्शी सेवाएं।">
    <meta name="theme-color" content="#013220">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- 🎨 External CSS File -->
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* 🔒 डिजिटल ताला: लॉगिन से पहले वेबसाइट छुपी रहेगी */
        body { display: none; } 
        
        .timer-box { background: var(--krya-gold); color: var(--monaco-green); padding: 10px; border-radius: 8px; text-align: center; font-weight: bold; margin: 15px auto; max-width: 600px; display: flex; justify-content: space-around;}
        .time-part { display: flex; flex-direction: column; font-size: 20px;}
        .time-label { font-size: 10px; color: #000;}
    </style>
</head>
<body>

    <header class="krya-header">
        <div class="logo-container">
            <img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEi1bixMJd4JUYrenIP1acbcd46lNVBY5rfCPPcjUCJjuZErSbl-Wee_0EW1obL3da5L23jC1XZlamC2kazOPj9YyRWd_sY5zebrtxVk53gb048BI1jiuHnc5ZRLKwMvBtAkcmbJHrKcr5OPeKyVcjTtAz8rUk89R7Vkt603kbahMh58ikA9S-bJDdiVdJ4/s600/1000537308.jpg" alt="KRYA Global Logo" class="krya-logo" loading="lazy">
            <h1 class="header-title">KRYA GLOBAL</h1>
        </div>
    </header>

    <button type="button" id="krya-global-sarathi" onclick="window.toggleKryaGlobalSpeech()" class="krya-floating-assistant" aria-label="AI Voice Assistant">
        🤖 KRYA एआई असिस्टेंट
    </button>

    <main>
        <div class="timer-box">
            <div class="time-part"><span id="days">00</span><span class="time-label">दिन</span></div>
            <div class="time-part"><span id="hours">00</span><span class="time-label">घंटे</span></div>
            <div class="time-part"><span id="minutes">00</span><span class="time-label">मिनट</span></div>
            <div class="time-part"><span id="seconds">00</span><span class="time-label">सेकंड</span></div>
        </div>

        <section class="krya-section">
            <h2 class="section-title">🌟 KRYA के 15 अजूबे</h2>
            <div class="ajoobe-grid">
                <!-- (आपके सभी 15 अजूबे वाले लिंक्स यहाँ रहेंगे) -->
            </div>
        </section>
    </main>

    <footer class="main-footer">
        <p>&copy; 2026 KRYA GLOBAL. डिजिटल फाउंडर - मुकेश जी। 100% लीगल व्यवस्था।</p>
    </footer>

    <!-- Firebase Scripts -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    
    <script>
        // 🔑 डिजिटल दरवाजा लॉजिक
        firebase.initializeApp({ /* अपना config यहाँ डालें */ });
        
        firebase.auth().onAuthStateChanged((user) => {
            if (user) {
                // अगर चाबी (लॉगिन) है, तो वेबसाइट दिखाओ
                document.body.style.display = 'block';
            } else {
                // चाबी नहीं है, तो रजिस्ट्रेशन पेज पर भेजो
                window.location.href = 'register.html';
            }
        });
    </script>

    <script src="js/main.js" defer></script>
</body>
</html>
