<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KRYA सुकून</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --monaco-green: #0E3B20;
            --royal-gold: #D4AF37;
        }
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 0;
        }
        .header {
            background-color: var(--monaco-green);
            color: var(--royal-gold);
            padding: 25px 20px;
            text-align: center;
            border-bottom: 4px solid var(--royal-gold);
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .header h2 { margin: 0; font-size: 24px; }
        .header p { margin: 5px 0 0 0; font-size: 14px; opacity: 0.9; }
        
        .container {
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }
        .form-box {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            border-top: 5px solid var(--royal-gold);
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--monaco-green);
            font-size: 14px;
        }
        input, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-family: inherit;
            font-size: 15px;
            transition: border-color 0.3s;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: var(--royal-gold);
        }
        textarea {
            resize: vertical;
            min-height: 100px;
        }
        .submit-btn {
            background-color: var(--monaco-green);
            color: var(--royal-gold);
            border: 2px solid var(--royal-gold);
            padding: 15px;
            width: 100%;
            font-size: 16px;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.3s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .submit-btn:hover {
            background-color: var(--royal-gold);
            color: var(--monaco-green);
            border-color: var(--monaco-green);
        }
        .back-btn {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: var(--monaco-green);
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>🤝 KRYA सुकून</h2>
        <p>मानसिक शांति, आपसी सहयोग और सकारात्मक विचारों का मंच</p>
    </div>

    <div class="container">
        <div class="form-box">
            <div class="form-group">
                <label>आपका शुभ नाम (Your Name)</label>
                <input type="text" id="userName" placeholder="अपना नाम लिखें (वैकल्पिक)">
            </div>
            <div class="form-group">
                <label>विषय (Topic)</label>
                <input type="text" id="topic" placeholder="जैसे: सलाह चाहिए, अनुभव साझा करना है...">
            </div>
            <div class="form-group">
                <label>अपनी बात लिखें (Your Thoughts)</label>
                <textarea id="message" placeholder="बिना किसी झिझक के अपने मन की बात यहाँ लिखें..."></textarea>
            </div>
            
            <button class="submit-btn" onclick="submitSukoon()">अपनी बात साझा करें</button>
        </div>
        
        <a href="dashboard.html" class="back-btn">← डैशबोर्ड पर वापस जाएँ</a>
    </div>

    <script>
        // बटन दबाने पर फॉर्म सबमिट करने का लॉजिक
        function submitSukoon() {
            const topic = document.getElementById('topic').value;
            const message = document.getElementById('message').value;
            
            if (!topic || !message) {
                alert("कृपया विषय और अपनी बात ज़रूर लिखें।");
                return;
            }
            
            alert("🤝 KRYA सुकून: आपकी बात सुरक्षित रूप से दर्ज कर ली गई है। KRYA समुदाय हमेशा आपके साथ है।");
            
            // फॉर्म को खाली करने का कोड
            document.getElementById('userName').value = '';
            document.getElementById('topic').value = '';
            document.getElementById('message').value = '';
        }
    </script>
</body>
</html>
