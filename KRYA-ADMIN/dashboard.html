<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - KRYA Control Room</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <div id="loader" class="loader hidden"></div>
    <div id="toast-container"></div>

    <div class="app-layout">
        <!-- Sidebar -->
        <aside id="sidebar" class="sidebar">
            <div class="sidebar-header">
                <h2>KRYA</h2>
            </div>
            <nav class="sidebar-nav">
                <button class="nav-item active" data-target="dashboard-view">Dashboard</button>
                <button class="nav-item" data-target="buttons-view">Wonder Buttons</button>
                <button class="nav-item" data-target="analytics-view">Analytics</button>
                <button class="nav-item" data-target="logs-view">Activity Logs</button>
                <button class="nav-item" data-target="backup-view">Backup/Restore</button>
            </nav>
            <div class="sidebar-footer">
                <div class="user-info" id="current-user-info"></div>
                <button id="logout-btn" class="btn btn-danger">Logout</button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-header">
                <button id="mobile-menu-toggle" class="mobile-only">☰</button>
                <div class="header-search">
                    <input type="text" id="global-search" placeholder="Search buttons, categories...">
                </div>
                <div class="header-actions">
                    <button id="theme-toggle" class="btn-icon">🌓</button>
                </div>
            </header>

            <div id="view-container" class="view-container">
                <!-- Dashboard View will be injected here via JS -->
            </div>
        </main>
    </div>

    <!-- Modals Container -->
    <div id="modal-container"></div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
