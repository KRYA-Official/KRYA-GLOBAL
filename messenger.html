<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KRYA ग्लोबल चैट</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.0.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCtSIGAybHuIga19QpPRS1egRrsbhvJV2c",
            authDomain: "krya-94e55.firebaseapp.com",
            projectId: "krya-94e55",
            storageBucket: "krya-94e55.firebasestorage.app",
            messagingSenderId: "1025043894227",
            appId: "1:1025043894227:web:fa57c21ed2f6381a792926"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // मैसेज भेजने का फंक्शन
        window.sendMessage = async () => {
            let msg = document.getElementById("message").value;
            let user = document.getElementById("username").value || "अज्ञात सदस्य";
            if(msg !== "") {
                await addDoc(collection(db, "messages"), {
                    text: msg,
                    user: user,
                    timestamp: new Date()
                });
                document.getElementById("message").value = "";
            }
        };
    </script>
</head>
<body>
    <header class="krya-header">
        <h1>KRYA ग्लोबल फैमिली चैट</h1>
    </header>

    <main style="max-width: 600px; margin: 20px auto; padding: 20px;">
        <input type="text" id="username" placeholder="अपना नाम लिखें..." style="width:100%; margin-bottom:10px;">
        <div id="chat-box" style="height: 300px; border: 1px solid #ccc; overflow-y: scroll; padding: 10px;">
            <!-- मैसेज यहाँ दिखेंगे -->
        </div>
        <input type="text" id="message" placeholder="दिल की बात लिखें..." style="width:100%; margin-top:10px;">
        <button onclick="sendMessage()" class="krya-btn" style="width:100%; margin-top:10px;">भेजें (ग्लोबल चैट)</button>
    </main>
</body>
</html>
