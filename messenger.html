<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KRYA मैसेंजर - सुरक्षित संवाद</title>
    <meta name="theme-color" content="#013220">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .chat-container { max-width: 600px; margin: 20px auto; padding: 20px; background: #fff; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .chat-box { height: 300px; overflow-y: scroll; border: 1px solid #ddd; padding: 10px; margin-bottom: 10px; background: #f9f9f9; }
        .input-area { display: flex; gap: 10px; }
        input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 5px; }
        .quick-buttons { display: flex; gap: 5px; margin-bottom: 10px; overflow-x: auto; }
        .q-btn { background: #e0e0e0; border: none; padding: 5px 10px; border-radius: 15px; font-size: 12px; cursor: pointer; }
    </style>
</head>
<body>

    <header class="krya-header">
        <div class="logo-container">
            <img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEi1bixMJd4JUYrenIP1acbcd46lNVBY5rfCPPcjUCJjuZErSbl-Wee_0EW1obL3da5L23jC1XZlamC2kazOPj9YyRWd_sY5zebrtxVk53gb048BI1jiuHnc5ZRLKwMvBtAkcmbJHrKcr5OPeKyVcjTtAz8rUk89R7Vkt603kbahMh58ikA9S-bJDdiVdJ4/s600/1000537308.jpg" alt="Logo" class="krya-logo">
            <h1 class="header-title">KRYA मैसेंजर</h1>
        </div>
    </header>

    <main>
        <div class="chat-container">
            <div class="chat-box" id="chat">
                <p style="text-align: center; color: #888;">नमस्ते! KRYA मैसेंजर में आपका स्वागत है। मुकेश भाई आपकी मदद के लिए तैयार हैं।</p>
            </div>
            
            <div class="quick-buttons">
                <button class="q-btn" onclick="sendQuick('कृषि समस्या')">🌾 कृषि समस्या</button>
                <button class="q-btn" onclick="sendQuick('ऑर्डर जानकारी')">📦 ऑर्डर जानकारी</button>
                <button class="q-btn" onclick="sendQuick('नमस्ते')">🙏 नमस्ते</button>
            </div>

            <div class="input-area">
                <input type="text" id="message" placeholder="अपना मैसेज लिखें...">
                <button onclick="sendMessage()" class="krya-btn">भेजें</button>
            </div>
        </div>
        <div style="text-align: center;">
            <a href="index.html" class="krya-btn" style="background-color: #666;">🔙 होम पर वापस जाएं</a>
        </div>
    </main>

    <script>
        function sendMessage() {
            let msg = document.getElementById("message").value;
            if(msg !== "") {
                let chat = document.getElementById("chat");
                chat.innerHTML += `<p><b>आप:</b> ${msg}</p>`;
                // यहाँ हम बाद में Firebase का कोड जोड़ेंगे
                document.getElementById("message").value = "";
                chat.scrollTop = chat.scrollHeight;
            }
        }
        function sendQuick(txt) {
            document.getElementById("message").value = txt;
            sendMessage();
        }
    </script>
</body>
</html>
