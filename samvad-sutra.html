<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KRYA संवाद-सूत्र</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --monaco-green: #0E3B20;
            --royal-gold: #D4AF37;
        }
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 0;
        }
        .header {
            background-color: var(--monaco-green);
            color: var(--royal-gold);
            padding: 25px 20px;
            text-align: center;
            border-bottom: 4px solid var(--royal-gold);
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .header h2 { margin: 0; font-size: 24px; }
        .header p { margin: 5px 0 0 0; font-size: 14px; opacity: 0.9; }
        
        .container {
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }
        .form-box {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            border-top: 5px solid var(--royal-gold);
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--monaco-green);
            font-size: 14px;
        }
        input, textarea, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-family: inherit;
            font-size: 15px;
        }
        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: var(--royal-gold);
        }
        textarea {
            resize: vertical;
            min-height: 100px;
        }
        .submit-btn {
            background-color: var(--monaco-green);
            color: var(--royal-gold);
            border: 2px solid var(--royal-gold);
            padding: 15px;
            width: 100%;
            font-size: 16px;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.3s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .submit-btn:hover {
            background-color: var(--royal-gold);
            color: var(--monaco-green);
            border-color: var(--monaco-green);
        }
        .back-btn {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: var(--monaco-green);
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>💬 KRYA संवाद-सूत्र</h2>
        <p>सीधा संपर्क, सच्चा मार्गदर्शन - सुरक्षित डिजिटल संचार केंद्र</p>
    </div>

    <div class="container">
        <div class="form-box">
            <div class="form-group">
                <label>आप किससे संपर्क करना चाहते हैं? (Connect With)</label>
                <select id="connectWith">
                    <option value="कृषि विशेषज्ञ">कृषि विशेषज्ञ (Farming Expert)</option>
                    <option value="बिजनेस सलाहकार">बिजनेस सलाहकार (Business Advisor)</option>
                    <option value="तकनीकी सहायता">तकनीकी सहायता टीम (Technical Support)</option>
                    <option value="समुदाय मार्गदर्शक">समुदाय मार्गदर्शक (Community Guide)</option>
                </select>
            </div>
            <div class="form-group">
                <label>आपका मोबाइल नंबर / यूज़र आईडी (Your Contact / ID)</label>
                <input type="text" id="contactInfo" placeholder="अपना संपर्क विवरण लिखें">
            </div>
            <div class="form-group">
                <label>आपका संदेश / सवाल (Your Message)</label>
                <textarea id="userMessage" placeholder="अपना सवाल या संदेश यहाँ विस्तार से लिखें ताकि सही उत्तर मिल सके..."></textarea>
            </div>

            <button class="submit-btn" onclick="sendMessage()">संदेश भेजें (Connect)</button>
        </div>

        <a href="dashboard.html" class="back-btn">← डैशबोर्ड पर वापस जाएँ</a>
    </div>

    <script>
        function sendMessage() {
            const target = document.getElementById('connectWith').value;
            const contact = document.getElementById('contactInfo').value;
            const msg = document.getElementById('userMessage').value;

            if (!contact || !msg) {
                alert("कृपया अपना संपर्क विवरण और संदेश पूरा भरें।");
                return;
            }

            alert("💬 KRYA संवाद-सूत्र: आपका संदेश '" + target + "' को सुरक्षित रूप से भेज दिया गया है। जल्द ही आपसे संपर्क किया जाएगा।");
            
            document.getElementById('contactInfo').value = '';
            document.getElementById('userMessage').value = '';
        }
    </script>
</body>
                                                                                                                     </html>
