<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KRYA किसान-सेतु</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --monaco-green: #0E3B20;
            --royal-gold: #D4AF37;
        }
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 0;
        }
        .header {
            background-color: var(--monaco-green);
            color: var(--royal-gold);
            padding: 25px 20px;
            text-align: center;
            border-bottom: 4px solid var(--royal-gold);
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .header h2 { margin: 0; font-size: 24px; }
        .header p { margin: 5px 0 0 0; font-size: 14px; opacity: 0.9; }
        
        .container {
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }
        .form-box {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            border-top: 5px solid var(--royal-gold);
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--monaco-green);
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-family: inherit;
            font-size: 15px;
            transition: border-color 0.3s;
        }
        input:focus {
            outline: none;
            border-color: var(--royal-gold);
        }
        .submit-btn {
            background-color: var(--monaco-green);
            color: var(--royal-gold);
            border: 2px solid var(--royal-gold);
            padding: 15px;
            width: 100%;
            font-size: 16px;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.3s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .submit-btn:hover {
            background-color: var(--royal-gold);
            color: var(--monaco-green);
            border-color: var(--monaco-green);
        }
        .back-btn {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: var(--monaco-green);
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>🌾 KRYA किसान-सेतु</h2>
        <p>बिना बिचौलिए का 100% पारदर्शी बाज़ार</p>
    </div>

    <div class="container">
        <div class="form-box">
            <div class="form-group">
                <label>फसल का नाम (Crop Name)</label>
                <input type="text" id="cropName" placeholder="जैसे: धान, गेहूँ, मक्का...">
            </div>
            <div class="form-group">
                <label>मात्रा (Quantity)</label>
                <input type="text" id="quantity" placeholder="जैसे: 50 क्विंटल">
            </div>
            <div class="form-group">
                <label>अपेक्षित दाम (Expected Price - ₹)</label>
                <input type="number" id="price" placeholder="प्रति क्विंटल दाम लिखें">
            </div>
            <div class="form-group">
                <label>स्थान (Location)</label>
                <input type="text" id="location" placeholder="गाँव या ज़िले का नाम">
            </div>
            
            <button class="submit-btn" onclick="submitCrop()">फसल का विज्ञापन डालें</button>
        </div>
        
        <a href="dashboard.html" class="back-btn">← डैशबोर्ड पर वापस जाएँ</a>
    </div>

    <script src="js/modules/kisan-setu.js"></script>
    <script>
        // बटन दबाने पर फॉर्म सबमिट करने का लॉजिक
        function submitCrop() {
            const name = document.getElementById('cropName').value;
            const qty = document.getElementById('quantity').value;
            const price = document.getElementById('price').value;
            const loc = document.getElementById('location').value;
            
            // जो फाइल हमने पहले बनाई थी, उसका जादू यहाँ चलेगा
            if(window.KisanSetu) {
                window.KisanSetu.addCropListing(name, qty, price, loc, "dummy.jpg");
            } else {
                alert("इंजन अभी लोड हो रहा है, कृपया थोड़ा इंतज़ार करें...");
            }
        }
    </script>
</body>
</html>
