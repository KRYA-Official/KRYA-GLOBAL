<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KRYA ईमानदारी-स्कोर</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --monaco-green: #0E3B20;
            --royal-gold: #D4AF37;
        }
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 0;
        }
        .header {
            background-color: var(--monaco-green);
            color: var(--royal-gold);
            padding: 25px 20px;
            text-align: center;
            border-bottom: 4px solid var(--royal-gold);
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .header h2 { margin: 0; font-size: 24px; }
        .header p { margin: 5px 0 0 0; font-size: 14px; opacity: 0.9; }
        
        .container {
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
            text-align: center;
        }
        .score-card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            border: 2px solid var(--royal-gold);
            margin-bottom: 20px;
        }
        .score-circle {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: var(--monaco-green);
            color: var(--royal-gold);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            font-weight: 700;
            margin: 0 auto 20px auto;
            border: 5px solid var(--royal-gold);
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .badge-text {
            font-size: 22px;
            font-weight: 600;
            color: var(--monaco-green);
            margin-bottom: 10px;
        }
        .info-text {
            color: #555;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .check-btn {
            background-color: var(--monaco-green);
            color: var(--royal-gold);
            border: 2px solid var(--royal-gold);
            padding: 12px 25px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .check-btn:hover {
            background-color: var(--royal-gold);
            color: var(--monaco-green);
            border-color: var(--monaco-green);
        }
        .back-btn {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: var(--monaco-green);
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>⚖️ KRYA ईमानदारी-स्कोर</h2>
        <p>आपकी सच्चाई ही आपकी सबसे बड़ी डिजिटल पहचान है</p>
    </div>

    <div class="container">
        <div class="score-card">
            <div class="score-circle" id="displayScore">0</div>
            <div class="badge-text" id="displayBadge">बैज: इंतज़ार...</div>
            <p class="info-text">आपका स्कोर हर सफल और ईमानदार लेन-देन के साथ बढ़ता है। धोखाधड़ी करने पर आईडी हमेशा के लिए ब्लॉक हो सकती है।</p>
            
            <button class="check-btn" onclick="checkMyScore()">मेरा वर्तमान स्कोर जांचें</button>
        </div>
        
        <a href="dashboard.html" class="back-btn">← डैशबोर्ड पर वापस जाएँ</a>
    </div>

    <script src="js/modules/imaandari-score.js"></script>
    <script>
        function checkMyScore() {
            if(window.ImaandariScore) {
                // अभी टेस्टिंग के लिए हम 240 पॉइंट्स का एक डेमो स्कोर दिखा रहे हैं
                const result = window.ImaandariScore.calculateScore(240, 'SUCCESSFUL_TRANSACTION');
                
                document.getElementById('displayScore').innerText = result.score;
                document.getElementById('displayBadge').innerText = "बैज: " + result.badge;
                
                // अगर गोल्ड बैज है तो रंग बदलें
                if(result.badge.includes("सोना")) {
                    document.getElementById('displayBadge').style.color = "#D4AF37"; // Gold color
                }
            } else {
                alert("इंजन अभी लोड हो रहा है...");
            }
        }
    </script>
</body>
</html>
